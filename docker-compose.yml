services:
  social-server:
    build: ./social_server
    init: true
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./social_server/config.yml:/app/config.yml:ro
      - ./social_server/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health',{headers:{'User-Agent':'ProjectGabrielSocial/healthcheck/1.0'}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  gabriel:
    build: .
    init: true
    restart: unless-stopped
    depends_on:
      social-server:
        condition: service_healthy
    network_mode: host
    user: "${GABRIEL_UID:-1000}:${GABRIEL_GID:-1000}"
    environment:
      PULSE_SERVER: unix:/run/pulse/native
      SDL_AUDIODRIVER: pulse
      HOME: /app/data/home
      HF_HOME: /app/data/huggingface
      NLTK_DATA: /app/data/nltk_data
      TORCH_HOME: /app/data/torch
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./config:/app/config
      - ./discord_bot/config.yml:/app/discord_bot/config.yml:ro
      - ./discord_bot/prompts:/app/discord_bot/prompts:ro
      - ./discord_bot/data:/app/discord_bot/data
      - ./data:/app/data
      - ./models:/app/models
      - ./plugins:/app/plugins
      - ./sfx:/app/sfx
      - ${PULSE_SOCKET:-/run/user/1000/pulse/native}:/run/pulse/native:ro
